<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <link rel="icon" type="image/png" href="https://www.dropbox.com/scl/fi/s3iifobqtf6m95nfghwco/Design-sem-nome222.png?rlkey=rmwmgl6kijzd6h5f809jaoa13&st=se6a747e&dl=1">
  <title>Rumo a Bariloche 🇦🇷</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Montserrat',sans-serif;
      background:linear-gradient(180deg,#0a1f44 0%,#1d4f91 45%,#74acdf 80%,#dcecf8 100%);
      background-attachment:fixed;
      color:#fff;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }

    .snow{position:fixed;inset:0;overflow:hidden;z-index:1;pointer-events:none}
    .flake{
      position:absolute;top:-20px;color:#fff;opacity:.85;
      animation:fall linear infinite;
    }
    @keyframes fall{
      to{transform:translate3d(var(--drift),110vh,0)}
    }

    .bg-video{
      position:fixed;inset:0;width:100%;height:100%;
      object-fit:cover;z-index:0;
    }
    .bg-overlay{
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background:linear-gradient(180deg,rgba(10,31,68,.55) 0%,rgba(10,31,68,.35) 50%,rgba(10,31,68,.6) 100%);
    }

    .topbar{
      width:100%;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;
      padding:20px;z-index:5;position:relative;
    }
    .mini-card{
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.25);
      backdrop-filter:blur(10px);
      border-radius:20px;padding:12px 18px;min-width:250px;
      text-align:center;box-shadow:0 0 20px rgba(0,0,0,.2);font-size:.95rem;
    }

    .container{
      width:min(95%,1400px);margin:auto;text-align:center;
      position:relative;z-index:4;padding:20px;
    }
    .flag{font-size:90px;margin-top:20px;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

    h1{
      font-size:clamp(2.5rem,7vw,6rem);font-weight:900;margin-top:10px;
      text-shadow:0 2px 24px rgba(0,20,60,.5);
    }
    .subtitle{
      margin-top:10px;font-size:clamp(1rem,2vw,1.4rem);opacity:.95;
      text-shadow:0 1px 10px rgba(0,20,60,.5);
    }

    .countdown{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:20px;margin-top:50px;
    }
    .card{
      background:rgba(10,31,68,.35);
      border:1px solid rgba(255,255,255,.28);
      backdrop-filter:blur(12px);
      border-radius:30px;padding:35px 20px;
      box-shadow:0 0 25px rgba(0,0,0,.25);transition:.3s;
    }
    .card:hover{transform:translateY(-5px) scale(1.02)}
    .number{font-size:clamp(3rem,8vw,6rem);font-weight:900;line-height:1}
    .label{margin-top:10px;font-size:1rem;letter-spacing:2px;text-transform:uppercase;opacity:.9}

    .extras{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:20px;margin-top:40px;margin-bottom:40px;
    }
    .panel{
      background:rgba(10,31,68,.35);
      border:1px solid rgba(255,255,255,.25);
      border-radius:25px;padding:25px;text-align:left;
      backdrop-filter:blur(10px);
    }
    .panel h2{margin-bottom:15px;font-size:1.3rem}
    .line{margin-bottom:12px;line-height:1.5}

    .trivia-text{
      min-height:70px;
      display:flex;
      align-items:center;
      font-size:1.05rem;
      line-height:1.5;
    }
    .trivia-btn{
      margin-top:15px;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.35);
      color:#fff;
      font-family:'Montserrat',sans-serif;
      font-weight:700;
      padding:10px 18px;
      border-radius:16px;
      cursor:pointer;
      transition:.25s;
      font-size:.9rem;
    }
    .trivia-btn:hover{
      background:rgba(255,255,255,.3);
      transform:translateY(-2px);
    }

    .footer{
      margin-top:20px;margin-bottom:60px;font-size:1rem;
      text-shadow:0 1px 10px rgba(0,20,60,.6);
    }

    @media(max-width:768px){
      .mini-card{width:100%}
      .card{padding:25px 15px}
      .number{font-size:4rem}
      .flag{font-size:70px}
    }
    @media(prefers-reduced-motion:reduce){
      .flake,.plane,.flag{animation:none}
    }
  </style>
</head>
<body>

  <div class="snow" id="snow"></div>

  <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="poster.jpg">
    <source src="fundo.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <div class="topbar">
    <div class="mini-card" id="clockCity">🕒 Carregando horário...</div>
    <div class="mini-card" id="weatherCity">☀️ Carregando clima...</div>
    <div class="mini-card" id="currencyCity">💵 Carregando cotação...</div>
  </div>

  <div class="container">

    <div class="flag">🇦🇷</div>

    <h1>RUMO A BARILOCHE</h1>

    <div class="subtitle">
      Cerro Catedral • 16 de Agosto de 2027
    </div>

    <div class="countdown">
      <div class="card"><div class="number" id="days">00</div><div class="label">Dias</div></div>
      <div class="card"><div class="number" id="hours">00</div><div class="label">Horas</div></div>
      <div class="card"><div class="number" id="minutes">00</div><div class="label">Minutos</div></div>
      <div class="card"><div class="number" id="seconds">00</div><div class="label">Segundos</div></div>
    </div>

    <div class="extras">
      <div class="panel">
        <h2>📊 Conversões Totais</h2>
        <div class="line" id="totalHours"></div>
        <div class="line" id="totalMinutes"></div>
        <div class="line" id="totalSeconds"></div>
      </div>

      <div class="panel">
        <h2>💡 Você sabia?</h2>
        <div class="trivia-text" id="triviaText"></div>
        <button class="trivia-btn" id="triviaBtn">🔄 Outra curiosidade</button>
      </div>
    </div>

    <div class="footer">
      Patagônia • Cerro Catedral • Neve • Chocolate • Aventura • Bariloche 🇦🇷
    </div>

  </div>

  <script>
    const TARGET_DATE = '2027-08-16T03:00:00';
    const TIMEZONE = 'America/Argentina/Buenos_Aires';
    const LAT = -41.1335, LON = -71.3103;

    const snow = document.getElementById('snow');
    for(let i=0;i<35;i++){
      const f = document.createElement('div');
      f.className = 'flake';
      f.textContent = '❄';
      f.style.left = Math.random()*100 + '%';
      f.style.fontSize = (Math.random()*12+8) + 'px';
      f.style.animationDuration = (Math.random()*10+8) + 's';
      f.style.animationDelay = (-Math.random()*18) + 's';
      f.style.setProperty('--drift', (Math.random()*120-60) + 'px');
      snow.appendChild(f);
    }

    const targetDate = new Date(TARGET_DATE);

    function updateCountdown(){
      const diff = targetDate - new Date();

      if(diff <= 0){
        document.body.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;flex-direction:column;
                      height:100vh;color:white;font-family:Montserrat;text-align:center;
                      background:linear-gradient(180deg,#0a1f44,#74acdf);">
            <h1 style="font-size:4rem;">🇦🇷 CHEGOU O DIA 🇦🇷</h1>
            <p style="font-size:2rem;">Boa viagem para Bariloche!</p>
          </div>`;
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff / 3600000) % 24);
      const minutes = Math.floor((diff / 60000) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').innerText = String(days).padStart(2,'0');
      document.getElementById('hours').innerText = String(hours).padStart(2,'0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2,'0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2,'0');

      document.getElementById('totalHours').innerHTML = `⏳ ${Math.floor(diff/3600000).toLocaleString()} horas`;
      document.getElementById('totalMinutes').innerHTML = `🕐 ${Math.floor(diff/60000).toLocaleString()} minutos`;
      document.getElementById('totalSeconds').innerHTML = `⚡ ${Math.floor(diff/1000).toLocaleString()} segundos`;
    }
    setInterval(updateCountdown,1000);
    updateCountdown();

    function updateClock(){
      const now = new Date().toLocaleString('pt-BR',{
        timeZone:TIMEZONE,hour:'2-digit',minute:'2-digit',second:'2-digit',
        day:'2-digit',month:'2-digit',year:'numeric'
      });
      document.getElementById('clockCity').innerHTML = `🕒 Bariloche agora: <strong>${now}</strong>`;
    }
    setInterval(updateClock,1000);
    updateClock();

    async function getWeather(){
      try{
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true`);
        const d = await r.json();
        document.getElementById('weatherCity').innerHTML =
          `❄️ ${d.current_weather.temperature}°C • 💨 ${d.current_weather.windspeed} km/h`;
      }catch(e){
        document.getElementById('weatherCity').innerHTML = '❌ Clima indisponível';
        console.log(e);
      }
    }
    getWeather();

    async function getCurrency(){
      try{
        const r = await fetch('https://economia.awesomeapi.com.br/json/last/BRL-ARS');
        const d = await r.json();
        document.getElementById('currencyCity').innerHTML =
          `💵 1 BRL ≈ ${Number(d.BRLARS.bid).toFixed(2)} ARS`;
      }catch(e){
        document.getElementById('currencyCity').innerHTML = '❌ Cotação indisponível';
        console.log(e);
      }
    }
    getCurrency();

    const trivia = [
      "Bariloche se chamava originalmente 'Vuriloche', palavra mapuche que significa 'pessoas do outro lado da montanha'.",
      "Em 2015, a cidade foi declarada oficialmente a Capital Nacional do Chocolate na Argentina.",
      "O Cerro Catedral é o maior e mais antigo centro de esqui da América do Sul, com pistas desde 1938.",
      "O Lago Nahuel Huapi tem mais de 500 km² e fica dentro de um dos parques nacionais mais antigos da Argentina, criado em 1934.",
      "Bariloche abriga o Centro Atómico Bariloche e a empresa INVAP, responsável por satélites e reatores nucleares exportados para vários países.",
      "A arquitetura do centro da cidade, em estilo alpino, foi inspirada propositalmente nos chalés suíços e austríacos pelos primeiros colonizadores europeus.",
      "O Parque Nacional Nahuel Huapi foi o primeiro parque nacional da Argentina, criado a partir de uma doação de terras do explorador Francisco Moreno.",
      "A região é conhecida como a 'Suíça Argentina' por causa das montanhas, lagos e arquitetura que lembram os Alpes.",
      "O Circuito Chico, um dos passeios mais famosos de Bariloche, é cercado por paisagens que lembram cenários de filmes de aventura.",
      "O cordeiro patagônico assado na cruz é um prato tradicional da região, preparado lentamente ao ar livre sobre brasas.",
      "Bariloche fica às margens da Cordilheira dos Andes, na fronteira natural entre a Argentina e o Chile.",
      "A cidade recebe milhares de estudantes argentinos todo ano para o tradicional 'viaje de egresados', viagem de formatura do ensino médio.",
      "O Cerro Tronador, próximo a Bariloche, tem geleiras visíveis mesmo no verão e seu nome vem do som de trovão causado pela queda de blocos de gelo.",
      "A Patagônia Argentina, onde fica Bariloche, abriga uma das menores densidades populacionais do mundo.",
      "Bariloche é ponto de partida para a Ruta de los Siete Lagos, uma das estradas panorâmicas mais famosas da Argentina."
    ];

    let lastIndex = -1;
    function showTrivia(){
      let idx;
      do{ idx = Math.floor(Math.random()*trivia.length); }while(idx === lastIndex && trivia.length>1);
      lastIndex = idx;
      document.getElementById('triviaText').innerText = trivia[idx];
    }
    document.getElementById('triviaBtn').addEventListener('click', showTrivia);
    showTrivia();
  </script>

</body>
</html>
